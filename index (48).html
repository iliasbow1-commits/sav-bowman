<style>
:root{--bg:#eceeed;--sf:#fff;--tx:#232826;--mu:#666d69;--ln:#d6dad8;--ac:#1b8f3e;--as:#e2f3e7;--r:#c0392b;--p:#c77700;--v:#6b4fbb;--n:#6d7471;--o:#1f8a45}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121513;--sf:#1c201e;--tx:#e8ece9;--mu:#9aa39e;--ln:#2f3633;--ac:#35c25f;--as:#173223;--r:#ef6b5b;--p:#e0a030;--v:#a58cf0;--n:#9aa39e;--o:#4fcf7a}}
:root[data-theme="dark"]{--bg:#121513;--sf:#1c201e;--tx:#e8ece9;--mu:#9aa39e;--ln:#2f3633;--ac:#35c25f;--as:#173223;--r:#ef6b5b;--p:#e0a030;--v:#a58cf0;--n:#9aa39e;--o:#4fcf7a}
:root{box-sizing:border-box}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;min-height:40px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=checkbox]{min-height:0;width:18px;height:18px;padding:0}
.pr{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.dg{color:var(--r)}
header{position:sticky;top:0;z-index:500;background:var(--sf);border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:18px;margin:0 8px 0 0;letter-spacing:-.01em}#q{flex:1;min-width:150px}
.tabs{display:flex;overflow-x:auto;max-width:100%}.tabs button{border-radius:0;border-width:0 0 3px;background:none;padding:6px 10px;white-space:nowrap}.tabs button.on{border-color:var(--ac);font-weight:700}
.bd{border-radius:99px;font-weight:700;border-color:var(--c);color:var(--c)}.bd.z{display:none}
#bn{display:none;margin:10px 14px 0;padding:10px 14px;border-radius:10px;background:var(--as);border:1px solid var(--ac);align-items:center;gap:10px;flex-wrap:wrap}#bn.s{display:flex}#bn span{flex:1;min-width:200px}
.kp{display:flex;gap:8px;padding:12px 14px 0;overflow-x:auto}.kp button{flex:none;min-width:104px;text-align:left;border-radius:10px;border-left:4px solid var(--c);padding:6px 12px}
.kp b{display:block;font-size:22px;line-height:1.1}.kp span{font-size:12px;color:var(--mu)}.kp .on{background:var(--as);border-color:var(--c)}
main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:12px;padding:12px 14px}
#list,#det{background:var(--sf);border:1px solid var(--ln);border-radius:12px;max-height:calc(100vh - 190px);overflow:auto}#det{padding:18px}
body.w main{grid-template-columns:1fr}body.w #list{display:none}body.w #det{max-height:none;overflow:visible}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer}.row:hover,.row.on{background:var(--as)}
.row .m{flex:1;min-width:0}.row b,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small,.mu{color:var(--mu);font-size:13px}
.pill{font-size:12px;font-weight:600;white-space:nowrap;color:var(--c)}.pill:before{content:"●";margin-right:4px}
.r{--c:var(--r)}.p{--c:var(--p)}.v{--c:var(--v)}.n{--c:var(--n)}.o{--c:var(--o)}.x{--c:var(--mu)}
.dh{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}.dh h2{margin:0 0 4px;font-size:22px}
.mc{border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:10px;padding:12px;margin:10px 0}
.mc h4{margin:0 0 2px;font-size:16px}.g{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.g button,.g a button{padding:6px 10px;min-height:34px;font-size:14px}.g a{text-decoration:none}
.warn{color:var(--p);font-size:13px;font-weight:600}.back{display:none;margin-bottom:10px}.emp{padding:28px;text-align:center;color:var(--mu)}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);width:min(480px,94vw);max-height:92vh;padding:18px}dialog.W{width:min(680px,96vw)}dialog::backdrop{background:#0008}
dialog label{display:block;margin:10px 0 0;font-size:13px;color:var(--mu)}dialog input,dialog select,dialog textarea{width:100%;margin-top:3px;color:var(--tx)}
dialog details{margin-top:12px;border:1px solid var(--ln);border-radius:10px;padding:8px 12px}dialog summary{cursor:pointer;font-weight:600;padding:4px 0}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}h3{margin:0 0 4px}
#ts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:2000;max-width:92vw}
.tb{display:flex;gap:8px;padding:10px 14px 0;flex-wrap:wrap}.tb select{flex:1;min-width:120px;max-width:240px}
.gh{padding:8px 12px;background:var(--bg);font-weight:700;position:sticky;top:0}
.gr{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:8px;margin:4px 0}.gr i{display:block;height:10px;border-radius:5px;background:var(--ac)}.gr b{text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.card{border:1px solid var(--ln);border-radius:12px;padding:12px}.card .row{padding:8px 4px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{background:var(--bg);cursor:pointer;position:sticky;top:0;user-select:none}tbody tr:hover{background:var(--as)}td.c{cursor:pointer;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal .dn{text-align:center;font-size:12px;color:var(--mu);font-weight:600}
.cd{min-height:96px;border:1px solid var(--ln);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden}.cd:hover{border-color:var(--ac)}.cd.t{border:2px solid var(--ac)}.cd.o2{opacity:.45}.cd.e{cursor:default}
.cd .n2{font-size:12px;color:var(--mu);display:block;text-align:right}
.ch{display:block;width:100%;text-align:left;font-size:11px;line-height:1.2;padding:2px 5px;min-height:0;margin-top:2px;border-radius:5px;border:1px solid var(--c);color:var(--c);background:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch.pl{background:var(--c);color:#fff}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.nav h2{margin:0;flex:1;font-size:20px;min-width:150px}
.map{height:68vh;min-height:360px;border-radius:12px;border:1px solid var(--ln);z-index:0}.map.s{height:56vh}
.mk{display:block;width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 4px #0007}
.nb{display:flex;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;border:2px solid #fff;font-weight:700;font-size:13px;align-items:center;justify-content:center;box-shadow:0 1px 4px #0007}
.tr{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:14px}
.st2{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--ln)}.st2 .m{flex:1;min-width:0}.st2 b{display:block}.st2 button{padding:2px 8px;min-height:32px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}.fl label{font-size:12px;color:var(--mu);display:block}.fl input,.fl select{display:block;margin-top:2px}
.leaflet-popup-content button{margin:3px 3px 0 0;padding:4px 8px;min-height:30px;font-size:13px;color:#14201f;background:#fff}
@media print{header,.kp,.tb,#list,.g,.back,#ts,#bn,.nav button,.fl,.map{display:none!important}main{display:block;padding:0}#det{display:block!important;border:0;max-height:none}body{background:#fff;color:#000}.tw{overflow:visible}}
@media(max-width:820px){main{grid-template-columns:1fr}#list,#det{max-height:none}body:not(.d):not(.w) #det{display:none}body.d:not(.w) #list{display:none}.back{display:inline-block}.tr{grid-template-columns:1fr}.cd{min-height:64px}.cd .ch{font-size:10px}header{gap:6px}}
#gate{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;background:var(--bg);padding:20px}

 d.m.forEach(m=>{m.h=m.h||[];m.ga=m.ga||'';m.pl=m.pl||'';m.ct=m.ct||'';m.d=m.d||'';m.p=m.p??'';m.cf=m.cf||'';if(m.g&&!d.gammes.includes(m.g))d.gammes.push(m.g)});

/* ---------- calculs ---------- */
function info(m){if(!m.d)return{s:'À renseigner'};const d=pd(m.d);if(d>today())return{s:'Date à vérifier'};const n=new Date(d.getFullYear(),d.getMonth(),1);n.setMonth(n.getMonth()+(+m.p||+DB.per));n.setDate(Math.min(d.getDate(),new Date(n.getFullYear(),n.getMonth()+1,0).getDate()));const j=Math.round((n-today())/864e5);return{s:j<0?'En retard':j<=DB.seuil?'À prévoir':'OK',n:iso(n),j}}

async function geo(q){const r=await fetch('https://api-adresse.data.gouv.fr/search/?limit=1&q='+encodeURIComponent(q));const j=await r.json(),f=j.features&&j.features[0];return f&&f.properties.score>.3?{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],lq:f.properties.type}:null}

async function routeInfo(){const my=++TOK,P=tpts().filter(c=>c.lat!=null),st=depPt(),t=T(),R=(st?[st]:[]).concat(P);if(t.back&&st)R.push(st);const el=$('#tt');if(!el)return;

async function anLoad(){if(!API||!PWD)return;try{const r=await api('annuaire');if(r.ok&&r.clients){AN={c:r.clients.filter(c=>c.n),m:r.machines||[]};try{localStorage.setItem('sav_bowman_an',JSON.stringify(AN))}catch(e){}}}catch(e){}}
const anFind=q=>{q=norm(q);if(!AN||q.length<2)return[];return AN.c.filter(c=>norm(c.n).includes(q)&&!cli(c.n)).sort((a,b)=>(norm(a.n).startsWith(q)?0:1)-(norm(b.n).startsWith(q)?0:1)||a.n.localeCompare(b.n)).slice(0,8)};
const anMach=n=>AN?AN.m.filter(m=>norm(m.c)===norm(n)):[];
const anSec=()=>{const A=anFind(S.q);return A.length?'<div class="gh">Dans le Sheet (pas encore ajoutés)</div>'+A.map(a=>`<div class="row" tabindex="0" data-a="anAdd" data-v="${esc(a.n)}"><div class="m"><b>${esc(a.n)}</b><small>${esc(a.v||'—')} · ${anMach(a.n).length} machine(s)</small></div><button class="pr" data-a="anAdd" data-v="${esc(a.n)}">+ Ajouter</button></div>`).join(''):''};
