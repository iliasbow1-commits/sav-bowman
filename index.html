<script>

const API_URL='https://script.google.com/macros/s/AKfycbzq-hdMZRBYHqPR1X9rxSpQMsO9yQvXWBJkqqDunTmK66nEuRzEqihyZtBleHhGGK7n/exec';
/* ▲▲▲ */
const SEED={"c":[],"m":[],"seuil":30,"per":12};
const $=s=>document.querySelector(s),KEY='sav_bowman_v1',TK='sav_bowman_theme';
const ORD=['En retard','À prévoir','Date à vérifier','À renseigner','OK'],CL={'En retard':'r','À prévoir':'p','Date à vérifier':'v','À renseigner':'n','OK':'o','Sans machine':'x'};
const GAM0=['Vanta','Delta','Gold Xpert','BTX','Fischer','Rigaku','À préciser'],TYPES=['Préventive','Curative','Étalonnage','Installation'],CATS=['Devis','Facture','Rapport','Contrat','Autre'];
const TPL0={s:'Maintenance de vos équipements',b:'Bonjour {contact},\n\nLa maintenance de vos équipements arrive à échéance :\n{machines}\n\nPouvons-nous convenir d’une date d’intervention ?\n\nCordialement'};
const GV={'Tereos Artenay':'Artenay','Tereos Fère-Champenoise':'Fère-Champenoise','Tereos Origny':'Origny-Sainte-Benoite','Tereos Thumeries':'Thumeries','Framatome Montbard':'Montbard'};
const guessV=n=>{const m=n.match(/Cr[ée]dit Municipal (?:de |d’|d'|du |des )(.+)$/i);return m?m[1]:GV[n]||''};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)},iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>s?s.split('-').reverse().join('/'):'—';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ\s'’.\-]/g,'');
function mkC(o){return{n:'',ct:'',t:'',e:'',v:'',no:'',ad:'',cp:'',lat:null,lng:null,lq:'',docs:[],rel:'',...o}}
function seed(){const d={bk:iso(today()),seuil:SEED.seuil,per:SEED.per,c:SEED.c.map(r=>mkC({n:r[0],ct:r[1],t:r[2],e:r[3],v:r[4],no:r[5]})),m:SEED.m.map((r,i)=>({id:i+1,c:r[0],g:r[1],mo:r[2],rf:r[3],sn:r[4],q:r[5],d:r[6],p:r[7],cf:r[8],no:r[9],dv:r[10]}))};return mig(d)}
function mig(d){d.seuil=+d.seuil||30;d.per=+d.per||12;d.gammes=d.gammes||[...GAM0];d.tpl=d.tpl||{...TPL0};d.dep=d.dep||{a:'',lat:null,lng:null};d.co=d.co||'Bowman';d.types=d.types||TYPES;d.tour=d.tour||{date:iso(today()),ids:[],back:true,n:6,r:100};
 d.m.forEach(m=>{m.h=m.h||[];m.ga=m.ga||'';m.pl=m.pl||'';m.ct=m.ct||'';m.d=m.d||'';m.p=m.p??'';m.cf=m.cf||'';if(m.g&&!d.gammes.includes(m.g))d.gammes.push(m.g)});
 d.c=d.c.map(c=>mkC(c));d.c.forEach(c=>{if(!c.v){const g=guessV(c.n);if(g){c.v=g;c.vg=1}}});
 d.m.forEach(m=>{if(!d.c.some(c=>c.n===m.c)){const c=mkC({n:m.c});const g=guessV(c.n);if(g){c.v=g;c.vg=1}d.c.push(c)}});
 if(!d.v3){d.c=d.c.filter(c=>d.m.some(m=>m.c===c.n));d.v3=1}return d}
function load(){let d;try{const j=localStorage.getItem(KEY);if(j)d=JSON.parse(j)}catch(e){}return mig(d||seed())}
let DB=load(),U=null,FH=null,FHS='',FLM=0,MAPS=[],TOK=0,bnx=false;
let S={mode:'a',st:null,sel:null,q:'',g:'',v:'',o:'u',cal:{y:today().getFullYear(),m:today().getMonth()},ts:{k:8,d:1},chk:new Set()};

function toast(t,u){const e=$('#ts');e.innerHTML=esc(t)+(u&&U?' <button data-a="undo" style="margin-left:8px;min-height:28px;padding:2px 10px">Annuler</button>':'');e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',u?7000:3200)}
/* ---------- calculs ---------- */
function info(m){if(!m.d)return{s:'À renseigner'};const d=pd(m.d);if(d>today())return{s:'Date à vérifier'};const n=new Date(d.getFullYear(),d.getMonth(),1);n.setMonth(n.getMonth()+(+m.p||+DB.per));n.setDate(Math.min(d.getDate(),new Date(n.getFullYear(),n.getMonth()+1,0).getDate()));const j=Math.round((n-today())/864e5);return{s:j<0?'En retard':j<=DB.seuil?'À prévoir':'OK',n:iso(n),j}}
const mach=c=>DB.m.filter(m=>m.c===c),units=l=>l.reduce((a,m)=>a+(+m.q||1),0),cli=n=>DB.c.find(c=>c.n===n);
function cinfo(c){const l=mach(c.n);if(!l.length)return{s:'Sans machine',j:9e9,l};const x=l.map(info);return{s:ORD.find(o=>x.some(i=>i.s===o)),j:Math.min(...x.map(i=>i.j??9e9)),l}}
const addr=c=>[c.ad,c.cp,c.v].filter(Boolean).join(' ');
const hay=(c,ci)=>[c.n,c.ct,c.t,c.e,c.v,c.ad,c.no,ci.s,...ci.l.map(m=>[m.g,m.mo,m.rf,m.sn,m.no].join(' '))].join(' ').toLowerCase();
const ml=m=>[m.mo,m.rf].filter(Boolean).join(' · ')||m.g;
const hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const dur=s=>{const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')};
/* ---------- géolocalisation ---------- */
async function geo(q){const r=await fetch('https://api-adresse.data.gouv.fr/search/?limit=1&q='+encodeURIComponent(q));const j=await r.json(),f=j.features&&j.features[0];return f&&f.properties.score>.3?{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],lq:f.properties.type}:null}
async function geoOne(c){const q=addr(c);if(!q)return false;try{const g=await geo(q);if(g){Object.assign(c,g);save();return true}}catch(e){}return false}
async function geoAll(){const L=DB.c.filter(c=>addr(c)&&c.lat==null);if(!L.length){toast('Tous les clients ayant une adresse ou une ville sont déjà placés');return}let ok=0;for(let i=0;i<L.length;i++){toast('Recherche des positions… '+(i+1)+' / '+L.length);if(await geoOne(L[i]))ok++;await new Promise(r=>setTimeout(r,60))}toast(ok+' client(s) placé(s) sur la carte');render()}
const depPt=()=>DB.dep.lat!=null?DB.dep:null,depQ=()=>DB.dep.lat!=null?DB.dep.lat+','+DB.dep.lng:DB.dep.a;
const cq=c=>c.lat!=null?c.lat+','+c.lng:addr(c)||c.n;
