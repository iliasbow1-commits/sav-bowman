<style>
:root{--bg:#eceeed;--sf:#fff;--tx:#232826;--mu:#666d69;--ln:#d6dad8;--ac:#1b8f3e;--as:#e2f3e7;--r:#c0392b;--p:#c77700;--v:#6b4fbb;--n:#6d7471;--o:#1f8a45}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121513;--sf:#1c201e;--tx:#e8ece9;--mu:#9aa39e;--ln:#2f3633;--ac:#35c25f;--as:#173223;--r:#ef6b5b;--p:#e0a030;--v:#a58cf0;--n:#9aa39e;--o:#4fcf7a}}
:root[data-theme="dark"]{--bg:#121513;--sf:#1c201e;--tx:#e8ece9;--mu:#9aa39e;--ln:#2f3633;--ac:#35c25f;--as:#173223;--r:#ef6b5b;--p:#e0a030;--v:#a58cf0;--n:#9aa39e;--o:#4fcf7a}
:root{box-sizing:border-box}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;min-height:40px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=checkbox]{min-height:0;width:18px;height:18px;padding:0}
.pr{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.dg{color:var(--r)}
header{position:sticky;top:0;z-index:500;background:var(--sf);border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:18px;margin:0 8px 0 0;letter-spacing:-.01em}#q{flex:1;min-width:150px}
.tabs{display:flex;overflow-x:auto;max-width:100%}.tabs button{border-radius:0;border-width:0 0 3px;background:none;padding:6px 10px;white-space:nowrap}.tabs button.on{border-color:var(--ac);font-weight:700}
.bd{border-radius:99px;font-weight:700;border-color:var(--c);color:var(--c)}.bd.z{display:none}
#bn{display:none;margin:10px 14px 0;padding:10px 14px;border-radius:10px;background:var(--as);border:1px solid var(--ac);align-items:center;gap:10px;flex-wrap:wrap}#bn.s{display:flex}#bn span{flex:1;min-width:200px}
.kp{display:flex;gap:8px;padding:12px 14px 0;overflow-x:auto}.kp button{flex:none;min-width:104px;text-align:left;border-radius:10px;border-left:4px solid var(--c);padding:6px 12px}
.kp b{display:block;font-size:22px;line-height:1.1}.kp span{font-size:12px;color:var(--mu)}.kp .on{background:var(--as);border-color:var(--c)}
main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:12px;padding:12px 14px}
#list,#det{background:var(--sf);border:1px solid var(--ln);border-radius:12px;max-height:calc(100vh - 190px);overflow:auto}#det{padding:18px}
body.w main{grid-template-columns:1fr}body.w #list{display:none}body.w #det{max-height:none;overflow:visible}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer}.row:hover,.row.on{background:var(--as)}
.row .m{flex:1;min-width:0}.row b,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small,.mu{color:var(--mu);font-size:13px}
.pill{font-size:12px;font-weight:600;white-space:nowrap;color:var(--c)}.pill:before{content:"●";margin-right:4px}
.r{--c:var(--r)}.p{--c:var(--p)}.v{--c:var(--v)}.n{--c:var(--n)}.o{--c:var(--o)}.x{--c:var(--mu)}
.dh{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}.dh h2{margin:0 0 4px;font-size:22px}
.mc{border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:10px;padding:12px;margin:10px 0}
.mc h4{margin:0 0 2px;font-size:16px}.g{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.g button,.g a button{padding:6px 10px;min-height:34px;font-size:14px}.g a{text-decoration:none}
.warn{color:var(--p);font-size:13px;font-weight:600}.back{display:none;margin-bottom:10px}.emp{padding:28px;text-align:center;color:var(--mu)}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);width:min(480px,94vw);max-height:92vh;padding:18px}dialog.W{width:min(680px,96vw)}dialog::backdrop{background:#0008}
dialog label{display:block;margin:10px 0 0;font-size:13px;color:var(--mu)}dialog input,dialog select,dialog textarea{width:100%;margin-top:3px;color:var(--tx)}
dialog details{margin-top:12px;border:1px solid var(--ln);border-radius:10px;padding:8px 12px}dialog summary{cursor:pointer;font-weight:600;padding:4px 0}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}h3{margin:0 0 4px}
#ts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:2000;max-width:92vw}
.tb{display:flex;gap:8px;padding:10px 14px 0;flex-wrap:wrap}.tb select{flex:1;min-width:120px;max-width:240px}
.gh{padding:8px 12px;background:var(--bg);font-weight:700;position:sticky;top:0}
.gr{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:8px;margin:4px 0}.gr i{display:block;height:10px;border-radius:5px;background:var(--ac)}.gr b{text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.card{border:1px solid var(--ln);border-radius:12px;padding:12px}.card .row{padding:8px 4px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{background:var(--bg);cursor:pointer;position:sticky;top:0;user-select:none}tbody tr:hover{background:var(--as)}td.c{cursor:pointer;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal .dn{text-align:center;font-size:12px;color:var(--mu);font-weight:600}
.cd{min-height:96px;border:1px solid var(--ln);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden}.cd:hover{border-color:var(--ac)}.cd.t{border:2px solid var(--ac)}.cd.o2{opacity:.45}.cd.e{cursor:default}
.cd .n2{font-size:12px;color:var(--mu);display:block;text-align:right}
.ch{display:block;width:100%;text-align:left;font-size:11px;line-height:1.2;padding:2px 5px;min-height:0;margin-top:2px;border-radius:5px;border:1px solid var(--c);color:var(--c);background:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch.pl{background:var(--c);color:#fff}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.nav h2{margin:0;flex:1;font-size:20px;min-width:150px}
.map{height:68vh;min-height:360px;border-radius:12px;border:1px solid var(--ln);z-index:0}.map.s{height:56vh}
.mk{display:block;width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 4px #0007}
.nb{display:flex;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;border:2px solid #fff;font-weight:700;font-size:13px;align-items:center;justify-content:center;box-shadow:0 1px 4px #0007}
.tr{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:14px}
.st2{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--ln)}.st2 .m{flex:1;min-width:0}.st2 b{display:block}.st2 button{padding:2px 8px;min-height:32px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}.fl label{font-size:12px;color:var(--mu);display:block}.fl input,.fl select{display:block;margin-top:2px}
.leaflet-popup-content button{margin:3px 3px 0 0;padding:4px 8px;min-height:30px;font-size:13px;color:#14201f;background:#fff}
@media print{header,.kp,.tb,#list,.g,.back,#ts,#bn,.nav button,.fl,.map{display:none!important}main{display:block;padding:0}#det{display:block!important;border:0;max-height:none}body{background:#fff;color:#000}.tw{overflow:visible}}
@media(max-width:820px){main{grid-template-columns:1fr}#list,#det{max-height:none}body:not(.d):not(.w) #det{display:none}body.d:not(.w) #list{display:none}.back{display:inline-block}.tr{grid-template-columns:1fr}.cd{min-height:64px}.cd .ch{font-size:10px}header{gap:6px}}
#gate{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;background:var(--bg);padding:20px}

 d.m.forEach(m=>{m.h=m.h||[];m.ga=m.ga||'';m.pl=m.pl||'';m.ct=m.ct||'';m.d=m.d||'';m.p=m.p??'';m.cf=m.cf||'';if(m.g&&!d.gammes.includes(m.g))d.gammes.push(m.g)});

 if(!d.v3){d.c=d.c.filter(c=>d.m.some(m=>m.c===c.n));d.v3=1}return d}

let DB=load(),U=null,FH=null,FHS='',FLM=0,MAPS=[],TOK=0,bnx=false;
let S={mode:'a',st:null,sel:null,q:'',g:'',v:'',o:'u',cal:{y:today().getFullYear(),m:today().getMonth()},ts:{k:8,d:1},chk:new Set()};

/* ---------- calculs ---------- */
function info(m){if(!m.d)return{s:'À renseigner'};const d=pd(m.d);if(d>today())return{s:'Date à vérifier'};const n=new Date(d.getFullYear(),d.getMonth(),1);n.setMonth(n.getMonth()+(+m.p||+DB.per));n.setDate(Math.min(d.getDate(),new Date(n.getFullYear(),n.getMonth()+1,0).getDate()));const j=Math.round((n-today())/864e5);return{s:j<0?'En retard':j<=DB.seuil?'À prévoir':'OK',n:iso(n),j}}
const mach=c=>DB.m.filter(m=>m.c===c),units=l=>l.reduce((a,m)=>a+(+m.q||1),0),cli=n=>DB.c.find(c=>c.n===n);
function cinfo(c){const l=mach(c.n);if(!l.length)return{s:'Sans machine',j:9e9,l};const x=l.map(info);return{s:ORD.find(o=>x.some(i=>i.s===o)),j:Math.min(...x.map(i=>i.j??9e9)),l}}
const addr=c=>[c.ad,c.cp,c.v].filter(Boolean).join(' ');
const hay=(c,ci)=>[c.n,c.ct,c.t,c.e,c.v,c.ad,c.no,ci.s,...ci.l.map(m=>[m.g,m.mo,m.rf,m.sn,m.no].join(' '))].join(' ').toLowerCase();
const ml=m=>[m.mo,m.rf].filter(Boolean).join(' · ')||m.g;
const hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const dur=s=>{const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')};
/* ---------- géolocalisation ---------- */
async function geo(q){const r=await fetch('https://api-adresse.data.gouv.fr/search/?limit=1&q='+encodeURIComponent(q));const j=await r.json(),f=j.features&&j.features[0];return f&&f.properties.score>.3?{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],lq:f.properties.type}:null}
async function geoOne(c){const q=addr(c);if(!q)return false;try{const g=await geo(q);if(g){Object.assign(c,g);save();return true}}catch(e){}return false}
async function geoAll(){const L=DB.c.filter(c=>addr(c)&&c.lat==null);if(!L.length){toast('Tous les clients ayant une adresse ou une ville sont déjà placés');return}let ok=0;for(let i=0;i<L.length;i++){toast('Recherche des positions… '+(i+1)+' / '+L.length);if(await geoOne(L[i]))ok++;await new Promise(r=>setTimeout(r,60))}toast(ok+' client(s) placé(s) sur la carte');render()}
const depPt=()=>DB.dep.lat!=null?DB.dep:null,depQ=()=>DB.dep.lat!=null?DB.dep.lat+','+DB.dep.lng:DB.dep.a;

async function setDep(a){DB.dep={a:a.trim(),lat:null,lng:null};if(DB.dep.a){try{const g=await geo(DB.dep.a);if(g){DB.dep.lat=g.lat;DB.dep.lng=g.lng}else toast('Adresse de départ introuvable')}catch(e){toast('Recherche impossible hors connexion')}}save();render()}
/* ---------- tournée ---------- */
function order(pts,st,back){const s0=st||pts[0],arr=st?pts.slice():pts.slice(1);let o=[],cur=s0;while(arr.length){let bi=0,bd=1e9;arr.forEach((p,i)=>{const d=hav(cur,p);if(d<bd){bd=d;bi=i}});cur=arr.splice(bi,1)[0];o.push(cur)}
 const len=a=>{let t=0,p=s0;a.forEach(x=>{t+=hav(p,x);p=x});return t+(back?hav(p,s0):0)};let imp=true,g=0;
 while(imp&&g++<40){imp=false;for(let i=0;i<o.length-1;i++)for(let j=i+1;j<o.length;j++){const n=o.slice(0,i).concat(o.slice(i,j+1).reverse(),o.slice(j+1));if(len(n)<len(o)-1e-6){o=n;imp=true}}}return st?o:[pts[0],...o]}
function gmUrls(q,start,back){const L=q.slice();if(back&&start)L.push(start);const out=[];let org=start||null,i=0;while(i<L.length){const ch=L.slice(i,i+9),dest=ch[ch.length-1],wp=ch.slice(0,-1);out.push('https://www.google.com/maps/dir/?api=1&travelmode=driving'+(org?'&origin='+encodeURIComponent(org):'')+'&destination='+encodeURIComponent(dest)+(wp.length?'&waypoints='+wp.map(encodeURIComponent).join('%7C'):''));org=dest;i+=9}return out}

async function routeInfo(){const my=++TOK,P=tpts().filter(c=>c.lat!=null),st=depPt(),t=T(),R=(st?[st]:[]).concat(P);if(t.back&&st)R.push(st);const el=$('#tt');if(!el)return;

 const L=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);const hi=Math.floor(L/4294967296),lo=L>>>0;[hi,lo].forEach(x=>b.push(x>>>24&255,x>>>16&255,x>>>8&255,x&255));
 const R=(v,a)=>(v>>>a)|(v<<(32-a));
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24|b[o+4*i+1]<<16|b[o+4*i+2]<<8|b[o+4*i+3])>>>0;
  for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
  let[a,b2,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
  [a,b2,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)>>>0)}
 return H.map(x=>x.toString(16).padStart(8,'0')).join('')}
async function sha(s){try{if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return sha256js(s)}
async function api(action,extra){if(!API)throw new Error('API');const ac=new AbortController(),to=setTimeout(()=>ac.abort(),45000);

 machines:DB.m.map(m=>({c:m.c,g:m.g,mo:m.mo,rf:m.rf,sn:m.sn,q:m.q,d:m.d,p:m.p,cf:m.cf,no:m.no,dv:m.dv,ct:m.ct,ga:m.ga,pl:m.pl})),
 interventions:DB.m.flatMap(m=>m.h.map(x=>({c:m.c,m:ml(m),sn:m.sn,d:x.d,ty:x.ty,te:x.te,n:x.n}))),
 params:{seuil:DB.seuil,per:DB.per,gammes:DB.gammes},
 config:{tour:DB.tour,dep:DB.dep,tpl:DB.tpl,co:DB.co,tech:DB.tech,types:DB.types}});
function fromCloud(D){const x=D.config||{},P=D.params||{};
 const d={seuil:P.seuil,per:P.per,v3:1,c:(D.clients||[]).map(c=>{const X=c.x||{};return mkC({n:c.n,ct:c.ct,t:c.t,e:c.e,v:c.v,no:c.no,ad:c.ad,cp:c.cp,lat:c.lat,lng:c.lng,lq:X.lq||'',docs:X.docs||[],rel:X.rel||'',vg:X.vg})}),
  m:(D.machines||[]).map((r,i)=>({id:i+1,c:r.c,g:r.g,mo:r.mo,rf:r.rf,sn:r.sn,q:r.q,d:r.d,p:r.p,cf:r.cf,no:r.no,dv:r.dv,ct:r.ct,ga:r.ga,pl:r.pl,h:[]}))};
 if(P.gammes&&P.gammes.length)d.gammes=P.gammes.slice();
 ['tour','dep','tpl','co','tech','types'].forEach(k=>{if(x[k]!==undefined&&x[k]!==null)d[k]=x[k]});
 (D.interventions||[]).forEach(o=>{const m=d.m.find(z=>z.c===o.c&&z.sn===o.sn&&ml(z)===o.m)||d.m.find(z=>z.c===o.c);if(m)m.h.push({d:o.d,ty:o.ty,te:o.te,n:o.n})});
 d.m.forEach(m=>m.h.sort((a,b)=>b.d.localeCompare(a.d)));return mig(d)}
function adopt(data,hash){DB=fromCloud(data);META.hash=hash;META.dirty=false;metaSave();saveLocal();baseSave(toCloud());CLD.msg=''}
/* fusion à 3 voies : base (dernier état commun) / mes changements / Sheet. Plus de conflit à trancher à la main. */
let BASE=null,CR=0;try{BASE=JSON.parse(localStorage.getItem('sav_bowman_base'))}catch(e){}
const baseSave=d=>{BASE=d;try{localStorage.setItem('sav_bowman_base',JSON.stringify(d))}catch(e){}};
const norC=d=>{const k=DB;try{DB=fromCloud(d);return toCloud()}finally{DB=k}};
function mergeCloud(B,A,Rm){const J=JSON.stringify,kd=(arr,kf)=>{const m=new Map(),n={};(arr||[]).forEach(o=>{let k=kf(o);n[k]=(n[k]||0)+1;if(n[k]>1)k+='#'+n[k];m.set(k,o)});return m},
 mg=(b,a,r,kf)=>{const mb=kd(b,kf),ma=kd(a,kf),mr=kd(r,kf),out=[];new Set([...ma.keys(),...mr.keys(),...mb.keys()]).forEach(k=>{const x=mb.get(k),l=ma.get(k),y=mr.get(k),v=J(l)!==J(x)?l:y;if(v)out.push(v)});return out},
 pk=(a,b,r)=>J(a)!==J(b)?a:r;B=B||{};
 return{clients:mg(B.clients,A.clients,Rm.clients,o=>norm(o.n)),machines:mg(B.machines,A.machines,Rm.machines,o=>[norm(o.c),o.sn,o.mo,o.rf].join('|')),interventions:mg(B.interventions,A.interventions,Rm.interventions,o=>[o.c,o.m,o.sn,o.d,o.ty,o.te,o.n].join('|')),params:pk(A.params,B.params,Rm.params),config:pk(A.config,B.config,Rm.config)}}
function reconcile(D,h){const M=mergeCloud(BASE,toCloud(),norC(D));DB=fromCloud(M);META.hash=h;META.dirty=true;metaSave();saveLocal();render()}

 e.textContent=t+(META.dirty&&CLD.st!=='sync'&&CLD.st!=='off'?' · à envoyer':'');e.className=c;e.title=CLD.msg||'Synchronisation avec Google Sheets'}

let ft;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Sauvegarde du navigateur impossible : exportez en Excel')}}
function save(){saveLocal();if(!API)return;META.dirty=true;metaSave();cloudChip();clearTimeout(ft);ft=setTimeout(()=>cloudPush(),1500)}
async function cloudPush(force){if(!API||!PWD||CLD.busy||!CLD.loaded)return;if(!META.dirty&&!force)return;if(CLD.st==='conflict'&&!force)return;
 CLD.busy=true;CLD.st='sync';cloudChip();
 try{const sent=JSON.stringify(DB),cd=toCloud(),r=await api('save',{base:META.hash||'',force:!!force,data:cd});
  if(r.ok){CR=0;baseSave(cd);META.hash=r.hash;if(JSON.stringify(DB)===sent)META.dirty=false;metaSave();CLD.st='ok';CLD.msg='';if(META.dirty){clearTimeout(ft);ft=setTimeout(()=>cloudPush(),400)}}
  else if(r.conflict){CLD.busy=false;if(BASE&&!force&&++CR<4){reconcile(r.data,r.hash);return cloudPush()}CR=0;CLD.st='conflict';CLD.msg='Le Google Sheet a été modifié ailleurs';cloudChip();conflictDlg(r.data,r.hash);return}
  else{CLD.st='err';CLD.msg=r.error==='auth'?'Mot de passe refusé par le serveur Google (Code.gs)':r.error==='occupe'?'Serveur occupé, nouvel essai':(r.error||'Erreur serveur')}
 }catch(e){CLD.st='offline';CLD.msg=errTxt(e)}
 CLD.busy=false;cloudChip()}
async function cloudLoad(quiet,force){if(!API||!PWD||CLD.busy)return;if(quiet&&CLD.st==='conflict')return;CLD.busy=true;if(!quiet){CLD.st='sync';cloudChip()}
 try{const r=await api('load');
  if(!r.ok){CLD.st='err';CLD.msg=r.error==='auth'?'Mot de passe refusé par le serveur Google (Code.gs)':(r.error||'Erreur serveur');CLD.busy=false;cloudChip();return}
  CLD.loaded=true;
  const localHas=DB.c.length||DB.m.length,remHas=(r.data.clients||[]).length||(r.data.machines||[]).length;
  if(!BASE&&!META.dirty&&!force){if(localHas&&!remHas){CLD.st='conflict';CLD.msg='Cet appareil contient des données absentes du Sheet';CLD.busy=false;cloudChip();conflictDlg(r.data,r.hash);return}adopt(r.data,r.hash);CLD.st='ok';CLD.busy=false;render();cloudChip();return}
  if(force){adopt(r.data,r.hash);CLD.st='ok';CLD.busy=false;render();cloudChip();return}
  if(META.dirty&&META.hash!==r.hash){if(BASE){reconcile(r.data,r.hash);CLD.busy=false;await cloudPush();return}CLD.st='conflict';CLD.msg='Le Google Sheet et cet appareil ont chacun des changements';CLD.busy=false;cloudChip();conflictDlg(r.data,r.hash);return}
  if(META.dirty){CLD.busy=false;await cloudPush();return}
  if(r.hash!==META.hash){if(quiet&&$('#dlg').open){CLD.busy=false;return}adopt(r.data,r.hash);render();if(quiet)toast('Données mises à jour depuis Google Sheets')}
  CLD.st='ok';CLD.msg=''
 }catch(e){CLD.st='offline';CLD.msg=errTxt(e)}
 CLD.busy=false;cloudChip()}

/* ---------- annuaire : clients du Sheet à retrouver en tapant leur nom ---------- */
let AN=null,PICK=null;try{AN=JSON.parse(localStorage.getItem('sav_bowman_an'))}catch(e){}
async function anLoad(){if(!API||!PWD)return;try{const r=await api('annuaire');if(r.ok&&r.clients){AN={c:r.clients.filter(c=>c.n),m:r.machines||[]};try{localStorage.setItem('sav_bowman_an',JSON.stringify(AN))}catch(e){}}}catch(e){}}
const anFind=q=>{q=norm(q);if(!AN||q.length<2)return[];return AN.c.filter(c=>norm(c.n).includes(q)&&!cli(c.n)).sort((a,b)=>(norm(a.n).startsWith(q)?0:1)-(norm(b.n).startsWith(q)?0:1)||a.n.localeCompare(b.n)).slice(0,8)};
const anMach=n=>AN?AN.m.filter(m=>norm(m.c)===norm(n)):[];
const anSec=()=>{const A=anFind(S.q);return A.length?'<div class="gh">Dans le Sheet (pas encore ajoutés)</div>'+A.map(a=>`<div class="row" tabindex="0" data-a="anAdd" data-v="${esc(a.n)}"><div class="m"><b>${esc(a.n)}</b><small>${esc(a.v||'—')} · ${anMach(a.n).length} machine(s)</small></div><button class="pr" data-a="anAdd" data-v="${esc(a.n)}">+ Ajouter</button></div>`).join(''):''};
function anAdd(n){const a=AN&&AN.c.find(x=>x.n===n);if(!a||cli(n))return;snap();const c=mkC(a),M=anMach(n);DB.c.push(c);M.forEach(m=>DB.m.push({...m,c:n,q:+m.q||1,id:Math.max(0,...DB.m.map(x=>x.id))+1,h:[],pl:''}));mig(DB);save();S.mode='c';S.sel=n;S.q='';$('#q').value='';document.body.classList.add('d');render();geoOne(c).then(()=>render());toast(n+' ajouté'+(M.length?' avec '+M.length+' machine(s)':''),1)}
function anBind(){const f=$('#f'),n=f.elements.n;if(!n||!AN)return;const box=document.createElement('div');box.className='sgl';box.style.display='none';n.parentNode.style.position='relative';n.parentNode.appendChild(box);
 const hide=()=>box.style.display='none',pick=a=>{PICK=a;['n','v','t','ct','e','ad','cp','no'].forEach(k=>{if(f.elements[k])f.elements[k].value=a[k]||''});const d=f.querySelector('details');if(d)d.open=true;hide();const k=anMach(a.n).length;$('#amn').textContent=k;$('#amw').style.display=k?'block':'none';toast('Infos du Sheet reprises'+(k?' · '+k+' machine(s)':''))};
 n.oninput=()=>{PICK=null;$('#amw').style.display='none';const L=anFind(n.value);box._l=L;box.innerHTML=L.map((a,i)=>`<div data-i="${i}"><b>${esc(a.n)}</b> <small>${esc(a.v||'')}</small></div>`).join('');box.style.display=L.length?'block':'none'};
 box.onmousedown=e=>e.preventDefault();box.onclick=e=>{const d=e.target.closest('[data-i]');if(d)pick(box._l[+d.dataset.i])};
 n.onchange=()=>{const a=AN.c.find(x=>norm(x.n)===norm(n.value)&&!cli(x.n));if(a&&!PICK)pick(a)};n.onblur=()=>setTimeout(hide,150)}
/* ---------- même version sur tous les appareils ---------- */
async function checkV(){if(!/^https?:/.test(location.protocol))return;try{const t=await(await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'})).text(),m=t.match(/const APP_V='([^']+)'/);if(m&&m[1]!==APP_V)$('#vb').style.display='flex'}catch(e){}}
setInterval(checkV,3e5);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkV()});
theme();boot();
