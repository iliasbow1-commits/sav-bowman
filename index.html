<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow"><title>Espace client Bowman</title>
<style>
:root{--bg:#f1f4f2;--card:#fff;--tx:#1c2420;--mu:#5f6a64;--bd:#d9e0db;--ac:#1a9243;--onac:#fff;--ac2:#e5f4ea;--ok:#1a9243;--wa:#b86e00;--ko:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1411;--card:#18201b;--tx:#e8efea;--mu:#9aa8a0;--bd:#2a362e;--ac:#3fc468;--onac:#08210f;--ac2:#16281d;--ok:#3fc468;--wa:#f0a93b;--ko:#ef7466}}
*{box-sizing:border-box}html,body{margin:0}body{background-image:linear-gradient(180deg,var(--bg),var(--card) 140%);min-height:100vh;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,60,35,.05)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{min-height:110px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--ac);color:var(--onac);font-weight:600}
button.sec{background:var(--ac2);color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin:8px 0 16px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.b-ok{color:var(--ok)}.b-wa{color:var(--wa)}.b-ko{color:var(--ko)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}
.grid>.card{display:flex;flex-direction:column;margin-bottom:0}.grid>.card>.row:last-child{margin-top:auto}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.rec{background:var(--ac2);border-radius:8px;padding:10px 12px;font-size:14px}.rec b{display:inline-block;min-width:140px}
.err{color:var(--ko);margin-top:10px}.okmsg{background:var(--ac2);border-left:4px solid var(--ok);padding:12px;border-radius:8px;margin-bottom:12px}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer}
pre{white-space:pre-wrap;font:inherit;margin:6px 0}
.seg{display:flex;gap:8px}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.hid{display:none}.logo{display:block;width:min(300px,80%);height:auto;margin:0 auto 18px}.lg-s{height:38px;width:auto;display:block}.login{max-width:400px;margin:0 auto;padding-top:9vh}.login .card{padding:28px 26px;box-shadow:0 10px 40px rgba(20,60,35,.10);border-radius:16px;border-top:4px solid var(--ac)}.login h1{text-align:center;font-size:18px}.login .sub{text-align:center;margin:6px 0 4px}.hdr{background:var(--card);border-bottom:3px solid var(--ac);box-shadow:0 2px 12px rgba(20,60,35,.06)}.hdr .in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hdr b{font-size:15px}.hdr .mu{font-size:12px}

.edit{border:2px solid var(--ac)}.full{grid-column:1/-1}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.btns button{flex:1;min-width:120px}
button.lnk{background:none;color:var(--ac);padding:4px 0;font-weight:600;text-decoration:underline}
.jr{border-left:3px solid var(--bd);padding:8px 12px;margin:0 0 10px;background:var(--card);border-radius:0 8px 8px 0}
.jr b{display:block}.ro{display:inline-block;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;margin-left:8px;font-weight:400}
.brands{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:16px}.bc{display:flex;flex-direction:column;gap:6px;align-items:center;padding:26px 14px;background:var(--card);color:var(--tx);border:2px solid var(--bc);border-radius:14px}.bc .bn{font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bc)}.bc .bg{font-size:12px;font-weight:400;color:var(--mu)}.bc .bw{font-size:11px;font-weight:400;color:var(--wa)}.bc:hover{background:var(--bc)}.bc:hover .bn,.bc:hover .bg,.bc:hover .bw{color:#fff}
</style></head><body><div id="app"></div>

\nCordialement'};\nconst GV={'Tereos Artenay':'Artenay','Tereos Fère-Champenoise':'Fère-Champenoise','Tereos Origny':'Origny-Sainte-Benoite','Tereos Thumeries':'Thumeries','Framatome Montbard':'Montbard'};\nconst guessV=n=>{const m=n.match(/Cr[ée]dit Municipal (?:de |d’|d'|du |des )(.+)$/i);return m?m[1]:GV[n]||''};\nconst esc=s=>String(s??'').replace(/[&\u003c>\"]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};\nconst pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)},iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\nconst fmt=s=>s?s.split('-').reverse().join('/'):'—';\nconst norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ\\s'’.\\-]/g,'');\nfunction mkC(o){return{n:'',ct:'',t:'',e:'',v:'',no:'',ad:'',cp:'',lat:null,lng:null,lq:'',docs:[],rel:'',pr:0,br:'',...o}}\nfunction seed(){const d={bk:iso(today()),seuil:SEED.seuil,per:SEED.per,c:SEED.c.map(r=>mkC({n:r[0],ct:r[1],t:r[2],e:r[3],v:r[4],no:r[5]})),m:SEED.m.map((r,i)=>({id:i+1,c:r[0],g:r[1],mo:r[2],rf:r[3],sn:r[4],q:r[5],d:r[6],p:r[7],cf:r[8],no:r[9],dv:r[10]}))};return mig(d)}\nfunction mig(d){d.prof=d.prof||[];d.logs=d.logs||[];d.forms=d.forms||{};d.seuil=+d.seuil||30;d.per=+d.per||12;d.gammes=d.gammes||[...GAM0];d.tpl=d.tpl||{...TPL0};d.dep=d.dep||{a:'',lat:null,lng:null};d.co=d.co||BR.name;d.types=d.types||TYPES;d.tour=d.tour||{date:iso(today()),ids:[],back:true,n:6,r:100};\n d.m.forEach(m=>{m.h=m.h||[];m.ga=m.ga||'';m.pl=m.pl||'';m.ct=m.ct||'';m.d=m.d||'';m.p=m.p??'';m.cf=m.cf||'';if(m.g&&!d.gammes.includes(m.g))d.gammes.push(m.g)});\n (BR.gammes||[]).forEach(g=>{if(!d.gammes.includes(g))d.gammes.push(g)});d.gammes=d.gammes.filter(g=>!(BR.autres||[]).includes(g)||d.m.some(m=>m.g===g));\n d.c=d.c.map(c=>mkC(c));d.c.forEach(c=>{if(!c.v){const g=guessV(c.n);if(g){c.v=g;c.vg=1}}});\n d.m.forEach(m=>{if(!d.c.some(c=>c.n===m.c)){const c=mkC({n:m.c});const g=guessV(c.n);if(g){c.v=g;c.vg=1}d.c.push(c)}});\n if(!d.v3){d.c=d.c.filter(c=>c.pr||d.m.some(m=>m.c===c.n));d.v3=1}return d}\nfunction load(){let d;try{const j=localStorage.getItem(KEY);if(j)d=JSON.parse(j)}catch(e){}return mig(d||seed())}\nlet DB=load(),U=null,FH=null,FHS='',FLM=0,MAPS=[],TOK=0,bnx=false;\nlet S={mode:'a',st:null,sel:null,q:'',g:'',v:'',cat:'',o:'u',cal:{y:today().getFullYear(),m:today().getMonth()},ts:{k:8,d:1},chk:new Set()};\nconst snap=()=>{U=JSON.stringify(DB)};\n/* save() : voir le module « Google Sheets » plus bas */\nfunction toast(t,u){const e=$('#ts');e.innerHTML=esc(t)+(u&&U?' \u003cbutton data-a=\"undo\" style=\"margin-left:8px;min-height:28px;padding:2px 10px\">Annuler\u003c/button>':'');e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',u?7000:3200)}\n/* ---------- calculs ---------- */\nfunction info(m){if(!m.d)return{s:'À renseigner'};const d=pd(m.d);if(d>today())return{s:'Date à vérifier'};const n=new Date(d.getFullYear(),d.getMonth(),1);n.setMonth(n.getMonth()+(+m.p||+DB.per));n.setDate(Math.min(d.getDate(),new Date(n.getFullYear(),n.getMonth()+1,0).getDate()));const j=Math.round((n-today())/864e5);return{s:j\u003c0?'En retard':j\u003c=DB.seuil?'À prévoir':'OK',n:iso(n),j}}\nconst mach=c=>DB.m.filter(m=>m.c===c),units=l=>l.reduce((a,m)=>a+(+m.q||1),0),cli=n=>DB.c.find(c=>c.n===n);\nfunction cinfo(c){const l=mach(c.n);if(c.pr)return{s:'Prospect',j:9e9,l};if(!l.length)return{s:'Sans machine',j:9e9,l};const x=l.map(info);return{s:ORD.find(o=>x.some(i=>i.s===o)),j:Math.min(...x.map(i=>i.j??9e9)),l}}\nconst addr=c=>[c.ad,c.cp,c.v].filter(Boolean).join(' ');\nconst hay=(c,ci)=>[c.n,c.ct,c.t,c.e,c.v,c.ad,c.no,ci.s,...ci.l.map(m=>[m.g,m.mo,m.rf,m.sn,m.no].join(' '))].join(' ').toLowerCase();\nconst ml=m=>[m.mo,m.rf].filter(Boolean).join(' · ')||m.g;\nconst hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))};\nconst dur=s=>{const m=Math.round(s/60);return m\u003c60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')};\n/* ---------- géolocalisation ---------- */\nasync function geo(q){const r=await fetch('https://api-adresse.data.gouv.fr/search/?limit=1&q='+encodeURIComponent(q));const j=await r.json(),f=j.features&&j.features[0];return f&&f.properties.score>.3?{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],lq:f.properties.type}:null}\nasync function geoOne(c){const q=addr(c);if(!q)return false;try{const g=await geo(q);if(g){Object.assign(c,g);save();return true}}catch(e){}return false}\nasync function geoAll(){const L=DB.c.filter(c=>addr(c)&&c.lat==null);if(!L.length){toast('Tous les clients ayant une adresse ou une ville sont déjà placés');return}let ok=0;for(let i=0;i\u003cL.length;i++){toast('Recherche des positions… '+(i+1)+' / '+L.length);if(await geoOne(L[i]))ok++;await new Promise(r=>setTimeout(r,60))}toast(ok+' client(s) placé(s) sur la carte');render()}\nconst depPt=()=>DB.dep.lat!=null?DB.dep:null,depQ=()=>DB.dep.lat!=null?DB.dep.lat+','+DB.dep.lng:DB.dep.a;\nconst cq=c=>c.lat!=null?c.lat+','+c.lng:addr(c)||c.n;\nasync function setDep(a){DB.dep={a:a.trim(),lat:null,lng:null};if(DB.dep.a){try{const g=await geo(DB.dep.a);if(g){DB.dep.lat=g.lat;DB.dep.lng=g.lng}else toast('Adresse de départ introuvable')}catch(e){toast('Recherche impossible hors connexion')}}save();render()}\n/* ---------- tournée ---------- */\nfunction order(pts,st,back){const s0=st||pts[0],arr=st?pts.slice():pts.slice(1);let o=[],cur=s0;while(arr.length){let bi=0,bd=1e9;arr.forEach((p,i)=>{const d=hav(cur,p);if(d\u003cbd){bd=d;bi=i}});cur=arr.splice(bi,1)[0];o.push(cur)}\n const len=a=>{let t=0,p=s0;a.forEach(x=>{t+=hav(p,x);p=x});return t+(back?hav(p,s0):0)};let imp=true,g=0;\n while(imp&&g++\u003c40){imp=false;for(let i=0;i\u003co.length-1;i++)for(let j=i+1;j\u003co.length;j++){const n=o.slice(0,i).concat(o.slice(i,j+1).reverse(),o.slice(j+1));if(len(n)\u003clen(o)-1e-6){o=n;imp=true}}}return st?o:[pts[0],...o]}\nfunction gmUrls(q,start,back){const L=q.slice();if(back&&start)L.push(start);const out=[];let org=start||null,i=0;while(i\u003cL.length){const ch=L.slice(i,i+9),dest=ch[ch.length-1],wp=ch.slice(0,-1);out.push('https://www.google.com/maps/dir/?api=1&travelmode=driving'+(org?'&origin='+encodeURIComponent(org):'')+'&destination='+encodeURIComponent(dest)+(wp.length?'&waypoints='+wp.map(encodeURIComponent).join('%7C'):''));org=dest;i+=9}return out}\nconst T=()=>DB.tour,tpts=()=>T().ids.map(cli).filter(Boolean);\nfunction tourOpt(){const P=tpts(),a=P.filter(c=>c.lat!=null),b=P.filter(c=>c.lat==null);if(a.length>1)T().ids=order(a,depPt(),T().back).concat(b).map(c=>c.n)}\nfunction tourAuto(){const t=T(),n=+t.n||6,r=+t.r||100,st=depPt();let pool=DB.c.map(c=>({c,i:cinfo(c)})).filter(x=>x.c.lat!=null&&['En retard','À prévoir'].includes(x.i.s)&&!t.ids.includes(x.c.n));\n if(!pool.length){toast('Aucun client « en retard » ou « à prévoir » avec une position sur la carte');return}\n pool.sort((a,b)=>ORD.indexOf(a.i.s)-ORD.indexOf(b.i.s)||a.i.j-b.i.j||(st?hav(st,a.c)-hav(st,b.c):0));const sd=pool[0];\n const pick=[sd,...pool.slice(1).filter(x=>hav(sd.c,x.c)\u003c=r).sort((a,b)=>hav(sd.c,a.c)-hav(sd.c,b.c))].slice(0,Math.max(1,n-t.ids.length)).map(x=>x.c.n);\n t.ids=[...t.ids,...pick];tourOpt();save();render();toast(pick.length+' client(s) ajouté(s) autour de '+sd.c.n)}\nfunction tourPlan(){const t=T(),P=tpts();if(!P.length)return;snap();let k=0;P.forEach(c=>{const l=mach(c.n),u=l.filter(m=>info(m).s!=='OK');(u.length?u:l).forEach(m=>{m.pl=t.date;k++})});save();render();toast(k+' machine(s) planifiée(s) le '+fmt(t.date),1)}\nasync function routeInfo(){const my=++TOK,P=tpts().filter(c=>c.lat!=null),st=depPt(),t=T(),R=(st?[st]:[]).concat(P);if(t.back&&st)R.push(st);const el=$('#tt');if(!el)return;\n let legs=null,dist=0,dt=0,geom=null,est=true;\n if(R.l  try{sessionStorage.setItem('bw_sav',id);sessionStorage.removeItem('bw_choice')}catch(e){}
 document.title='SAV '+b.name+' – maintenances';document.documentElement.style.cssText='height:100%';document.body.style.cssText='margin:0;padding:0;height:100%;background:#fff';document.body.innerHTML='';

 f.srcdoc=SAV_SRC.replace('<head>',()=>'<head><script>window.BRAND='+JSON.stringify(b)+'<\/script>');document.body.appendChild(f)}
function choose(){try{sessionStorage.setItem('bw_choice','1')}catch(e){}
 const card=b=>`<button class="bc" data-b="${b.id}" style="--bc:${b.col}"><span class="bn">${b.name}</span><span class="bg">${b.gammes.filter(g=>g!=='À préciser').join(' · ')}</span>${b.api?'':'<span class="bw">Base non reliée (voir BRANDS)</span>'}</button>`;
 $('#app').innerHTML=`<div class="wrap"><div class="login" style="max-width:560px"><div class="card"><img class="logo" src="${LOGO}" alt="Bowman France"><h1>Accès équipe SAV</h1><p class="mu sub">Choisissez la base à ouvrir. Les deux bases sont indépendantes : clients, prospects, machines et gammes ne sont pas mélangés.</p><div class="brands">${Object.values(BRANDS).map(card).join('')}</div><p style="text-align:center;margin:14px 0 0"><a href="#" id="sw" style="color:var(--mu);font-size:13px">← Déconnexion</a></p></div></div></div>`;
 document.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>openSav(x.dataset.b));
 $('#sw').onclick=e=>{e.preventDefault();try{sessionStorage.removeItem('bw_choice');sessionStorage.removeItem('sav_bowman_mp')}catch(x){}eq=true;login()}}
function chooseBrand(){try{sessionStorage.removeItem('bw_sav');sessionStorage.setItem('bw_choice','1')}catch(e){}location.reload()}
try{if(/[?&]client\b/.test(location.search)){sessionStorage.removeItem('bw_sav');sessionStorage.removeItem('bw_choice')}else{const s=sessionStorage.getItem('bw_sav');if(s)setTimeout(()=>openSav(s==='1'?'bowman':s),0)}}catch(e){}
async function api(o){
 const body=JSON.stringify(o);let t;
 if(window.google&&google.script&&google.script.run&&google.script.run.withSuccessHandler){
  t=await new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error((e&&e.message)||e))).apiCall(body))}
 else{
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),45000);
  try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ac.signal});t=await r.text()}
  catch(e){throw new Error('Connexion impossible, vérifiez votre réseau.')}finally{clearTimeout(to)}}
 try{return JSON.parse(t)}catch(e){throw new Error('Réponse invalide du serveur')}}
function erreur(r){return (r.error==='auth'&&!r.srv)?'Le serveur Apps Script n’est pas à jour : collez le nouveau Code.gs puis faites Déployer → Gérer les déploiements → Modifier → Nouvelle version → Déployer.':r.error==='auth'?'Nom ou mot de passe incorrect.':r.error==='verrou'?'Trop de tentatives. Réessayez dans 15 minutes.':r.error==='occupe'?'Service occupé, réessayez.':(r.error||'Erreur')}

let eq=false;
function login(){
 $('#app').innerHTML=`<div class="wrap"><div class="login"><div class="card"><img class="logo" src="${LOGO}" alt="Bowman France"><h1>${eq?'Accès équipe SAV':'Espace client Bowman France'}</h1><p class="mu sub">${eq?'Réservé à l’équipe Bowman France.':'Connectez-vous pour consulter vos machines, votre historique et contacter le support.'}</p>
 ${eq?'':'<label>Nom de votre société</label><input id="ln" autocomplete="username">'}<label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password">
 <p class="err" id="le"></p><button id="lb" style="width:100%">Se connecter</button>
 <p style="text-align:center;margin:14px 0 0"><a href="#" id="sw" style="color:var(--mu);font-size:13px">${eq?'← Accès client':'Accès équipe SAV'}</a></p></div></div></div>`;
 $('#sw').onclick=e=>{e.preventDefault();eq=!eq;login()};
 const go=async()=>{const b=$('#lb');b.disabled=true;$('#le').textContent='';
  try{
   if(eq){
    const r=await api({action:'ping',pwd:$('#lp').value});
    if(!r.ok){$('#le').textContent=r.error==='auth'?'Mot de passe incorrect.':erreur(r);b.disabled=false;return}
    try{sessionStorage.setItem('sav_bowman_mp',$('#lp').value)}catch(e){}choose();return}
   const r=await api({action:'client_login',client:$('#ln').value,mdp:$('#lp').value});
   if(!r.ok){$('#le').textContent=erreur(r);b.disabled=false;return}
   S={client:$('#ln').value,mdp:$('#lp').value};D=r;tab='machines';draw()}
  catch(e){$('#le').textContent=e.message;b.disabled=false}};
 $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()}}

function addM(iso,m){const x=String(iso||'').match(/^(\d{4})-(\d\d)-(\d\d)/);if(!x||!(+m>0))return null;const d=new Date(+x[1],+x[2]-1+ +m,+x[3]);return d}
function etat(m){const nx=addM(m.d,m.p||D.per);if(!nx)return['Date inconnue','','—'];
 const j=Math.round((nx-new Date())/864e5),t=nx.toLocaleDateString('fr-FR');
 return j<0?['En retard','b-ko',t]:j<=D.seuil?['À prévoir','b-wa',t]:['À jour','b-ok',t]}
const nomM=m=>[m.g,m.mo].filter(Boolean).join(' ')||'Machine';

 const c=D.client;
 $('#app').innerHTML=`<div class="hdr"><div class="in"><div style="display:flex;align-items:center;gap:14px;min-width:0"><img class="lg-s" src="${LOGO}" alt="Bowman France"><div style="min-width:0"><b>${esc(c.n)}</b><div class="mu">Espace client</div></div></div><button class="sec" id="out">Déconnexion</button></div></div><div class="wrap">

 ({machines:vMachines,demande:vDemande,histo:vHisto,compte:vCompte})[tab]()}

function formM(m,i){const add=!m,today=new Date().toISOString().slice(0,10);
 return`<div class="card edit full"><b>${add?'Ajouter une machine':'Modifier la machine'}</b>
 <div class="grid" style="margin-top:4px"><div><label>Gamme</label><select id="mg">${gOpts(m?m.g:'À préciser')}<option value="__autre">Autre (saisir la gamme)…</option></select><input id="mgx" class="hid" maxlength="40" placeholder="Saisissez la gamme" style="margin-top:6px"></div>

 <p class="mu">${add?'Votre ajout sera vérifié par notre service SAV.':'Les dates de maintenance, la périodicité et la garantie sont gérées par notre service SAV.'} Chaque modification est enregistrée dans votre historique.</p>
 <p class="err" id="me"></p><div class="btns"><button id="msv">Enregistrer</button><button class="sec" id="mcx">Annuler</button></div></div>`}
function bindM(){
 const mg=$('#mg');if(mg)mg.onchange=()=>{const x=$('#mgx');x.classList.toggle('hid',mg.value!=='__autre');if(mg.value==='__autre')x.focus()};
 const cx=$('#mcx');if(cx)cx.onclick=()=>{edM=null;draw()};
 const sv=$('#msv');if(sv)sv.onclick=async()=>{const e=$('#me');e.textContent='';
  if(!$('#mm').value.trim()){e.textContent='Indiquez le modèle de la machine.';return}
  if($('#mg').value==='__autre'&&!$('#mgx').value.trim()){e.textContent='Saisissez la gamme.';return}
  sv.disabled=true;
  const o={action:'client_machine',client:S.client,mdp:S.mdp,mode:edM==='add'?'add':'edit',g:($('#mg').value==='__autre'?$('#mgx').value:$('#mg').value),mo:$('#mm').value,rf:$('#mr').value,sn:$('#ms').value,q:$('#mq').value};
  if(edM==='add'){o.d=$('#md')?$('#md').value:''}
  else{const m=D.machines[edM];o.mi=edM;o.sig=[m.g,m.mo,m.rf,m.sn].map(x=>x==null?'':x).join('|')}
  try{const r=await api(o);
   if(!r.ok){e.textContent=erreur(r);sv.disabled=false;return}
   const add=edM==='add';D=r;edM=null;
   flash=r.aucun?'Aucune modification à enregistrer.':(add?'Machine ajoutée. Elle est inscrite dans votre historique.':'Machine modifiée. La modification est inscrite dans votre historique.');draw()}
  catch(x){e.textContent=x.message;sv.disabled=false}}}
function vMachines(){
 const full=D.machines.length>=(D.maxMachines||150);
 const bar=`<div class="row" style="margin-bottom:12px;align-items:center"><span class="mu">${D.machines.length} machine${D.machines.length>1?'s':''}</span><button id="addm" ${full?'disabled':''}>+ Ajouter une machine</button></div>`;
 const cards=D.machines.map((m,i)=>{if(edM===i)return formM(m,i);const e=etat(m);return`<div class="card"><div class="row"><b>${esc(nomM(m))}${m.q>1?' ×'+esc(m.q):''}</b><span class="badge ${e[1]}">${e[0]}</span></div>
 <div class="mu">N° de série : ${esc(m.sn||'—')}${m.rf?' · Réf. '+esc(m.rf):''}</div>
 <div style="margin:8px 0">Dernière maintenance : ${fd(m.d)}<br>Prochaine : ${e[2]}${m.pl?'<br>Visite planifiée : '+fd(m.pl):''}${m.ga?'<br>Fin de garantie : '+fd(m.ga):''}</div>
 <div class="btns"><button data-i="${i}" data-ty="intervention">Demander une intervention</button><button class="sec" data-i="${i}" data-ty="ticket">Ticket</button><button class="sec" data-ed="${i}">Modifier</button></div></div>`}).join('');
 $('#v').innerHTML=bar+(edM==='add'?`<div class="grid">${formM(null)}</div>`:'')+(D.machines.length?`<div class="grid">${cards}</div>`:(edM==='add'?'':'<div class="card mu">Aucune machine enregistrée.</div>'));
 $('#addm').onclick=()=>{edM='add';draw()};
 document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{edM=+b.dataset.ed;draw()});
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{type=b.dataset.ty;pre=b.dataset.i;tab='demande';draw()});
 bindM()}

function vDemande(){
 const c=D.client,adr=[c.ad,[c.cp,c.v].filter(Boolean).join(' ')].filter(Boolean).join(', ');
 $('#v').innerHTML=`<div class="card"><div class="seg"><button data-k="intervention" class="${type==='intervention'?'on':''}">Demande d’intervention</button><button data-k="ticket" class="${type==='ticket'?'on':''}">Ticket support</button></div>
 <label>Machine concernée</label><select id="fm">${type==='ticket'?'<option value="">— Aucune machine en particulier —</option>':''}${D.machines.map((m,i)=>`<option value="${i}" ${String(i)===pre?'selected':''}>${esc(nomM(m))} — ${esc(m.sn||'sans n°')}</option>`).join('')}</select>
 <div class="rec" style="margin-top:12px" id="rc"></div>
 <label>Urgence</label><select id="fu"><option>Normale</option><option>Urgente</option><option>Machine à l’arrêt</option></select>
 <label>Objet</label><input id="fo" maxlength="150" placeholder="${type==='intervention'?'Ex. : panne, maintenance, calibrage…':'Ex. : question, message d’erreur…'}">
 <label>Description</label><textarea id="fd" maxlength="4000" placeholder="Décrivez le problème ou votre besoin"></textarea>
 <div class="grid"><div><label>Contact sur site</label><input id="fc" value="${esc(c.ct)}"></div><div><label>Téléphone</label><input id="ft" value="${esc(c.t)}"></div></div>
 <label>E-mail de réponse</label><input id="fe" type="email" value="${esc(String(c.e||'').split(/[;, ]/)[0])}">
 <p class="err" id="fr"></p><button id="send" style="width:100%;margin-top:6px">Envoyer à ${esc(D.support)}</button></div>`;
 const rec=()=>{const i=$('#fm').value,m=i===''?null:D.machines[+i];
  $('#rc').innerHTML=`<b>Client</b> ${esc(c.n)}<br><b>Machine</b> ${m?esc(nomM(m)):'—'}<br><b>N° de série</b> ${m?esc(m.sn||'—'):'—'}<br><b>Adresse du site</b> ${esc(adr||'—')}<br><b>Envoyé à</b> ${esc(D.support)}`};
 rec();$('#fm').onchange=()=>{pre=$('#fm').value;rec()};
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{type=b.dataset.k;draw()});
 $('#send').onclick=async()=>{const b=$('#send');b.disabled=true;$('#fr').textContent='';
  try{const r=await api({action:'client_ticket',client:S.client,mdp:S.mdp,type,mi:$('#fm').value,urgence:$('#fu').value,objet:$('#fo').value,message:$('#fd').value,contact:$('#fc').value,tel:$('#ft').value,email:$('#fe').value});
   if(!r.ok){$('#fr').textContent=erreur(r);b.disabled=false;return}
   D.tickets=r.tickets;flash='Demande envoyée au support. Référence : <b>'+esc(r.ref)+'</b>. Vous recevez une copie par e-mail.';tab='histo';pre='';draw()}
  catch(e){$('#fr').textContent=e.message;b.disabled=false}}}

function vCompte(){
 const c=D.client;
 $('#v').innerHTML=`<div class="card"><h2 style="margin-top:0">Mes informations</h2>
 <p class="mu" style="margin-top:0">Le nom de votre société est aussi votre identifiant de connexion. Si vous le modifiez, utilisez le nouveau nom à votre prochaine connexion.</p>
 <label>Nom de la société (identifiant)</label><input id="cn" maxlength="120" value="${esc(c.n)}" autocomplete="off">
 <div class="grid"><div><label>Contact</label><input id="cc" maxlength="120" value="${esc(c.ct)}"></div><div><label>Téléphone</label><input id="ct" maxlength="60" value="${esc(c.t)}" inputmode="tel"></div></div>
 <label>E-mail</label><input id="ce" maxlength="200" value="${esc(c.e)}" inputmode="email">
 <label>Adresse</label><input id="ca" maxlength="200" value="${esc(c.ad)}">
 <div class="grid"><div><label>Code postal</label><input id="cp" maxlength="20" value="${esc(c.cp)}"></div><div><label>Ville</label><input id="cv" maxlength="80" value="${esc(c.v)}"></div></div>
 <p class="mu">Chaque modification est enregistrée dans votre historique.</p>
 <p class="err" id="ie"></p><button id="ib" style="width:100%">Enregistrer mes informations</button></div>
 <div class="card"><h2 style="margin-top:0">Changer mon mot de passe</h2>
 <p class="mu" style="margin-top:0">Choisissez un mot de passe personnel (6 caractères minimum). Les majuscules comptent.</p>
 <label>Mot de passe actuel</label><input id="pa" type="password" autocomplete="current-password">
 <label>Nouveau mot de passe</label><input id="pn" type="password" autocomplete="new-password">
 <label>Confirmer le nouveau mot de passe</label><input id="pc" type="password" autocomplete="new-password">
 <p class="err" id="pe"></p><button id="pb" style="width:100%">Enregistrer</button></div>`;
 $('#ib').onclick=async()=>{const e=$('#ie');e.textContent='';$('#ib').disabled=true;
  try{const r=await api({action:'client_profil',client:S.client,mdp:S.mdp,nom:$('#cn').value,ct:$('#cc').value,t:$('#ct').value,e:$('#ce').value,ad:$('#ca').value,cp:$('#cp').value,v:$('#cv').value});
   if(!r.ok){e.textContent=erreur(r);$('#ib').disabled=false;return}
   D=r;S.client=r.client.n;
   flash=r.aucun?'Aucune modification à enregistrer.':'Vos informations ont été enregistrées et inscrites dans votre historique.';tab='compte';draw()}
  catch(x){e.textContent=x.message;$('#ib').disabled=false}};
 $('#pb').onclick=async()=>{const e=$('#pe');e.textContent='';e.style.color='';
  const a=$('#pa').value,n=$('#pn').value,c=$('#pc').value;
  if(n.length<6){e.textContent='Le nouveau mot de passe doit faire au moins 6 caractères.';return}
  if(n!==c){e.textContent='La confirmation ne correspond pas.';return}
  $('#pb').disabled=true;
  try{const r=await api({action:'client_mdp',client:S.client,mdp:a,nouveau:n});
   if(!r.ok){e.textContent=r.error==='auth'?'Mot de passe actuel incorrect.':erreur(r);$('#pb').disabled=false;return}
   S.mdp=n;D=r;flash='Votre mot de passe a été modifié. Utilisez-le à votre prochaine connexion.';tab='machines';draw()}
  catch(x){e.textContent=x.message;$('#pb').disabled=false}}}
function vHisto(){
 const T=D.tickets.map(t=>`<div class="card"><div class="row"><b>${esc(t.objet)}</b><span class="badge">${esc(t.statut)}</span></div>
 <div class="mu">${esc(t.ref)} · ${esc(t.type)} · ${esc(String(t.date).slice(0,10).split('-').reverse().join('/'))}${t.machine?' · '+esc(t.machine)+(t.sn?' ('+esc(t.sn)+')':''):''}${t.urgence!=='Normale'?' · '+esc(t.urgence):''}</div><pre>${esc(t.message)}</pre></div>`).join('');
 const I=D.interventions.map(it=>{const r=it.rapport;return`<div class="card"><div class="row"><b>${fd(it.d)} · ${esc(it.ty||'Intervention')}</b><span class="mu">${esc(it.te||'')}</span></div>
 <div class="mu">${esc(it.m||'')}${it.sn?' · N° '+esc(it.sn):''}</div>${it.n?`<pre>${esc(it.n)}</pre>`:''}
 ${r?`<details><summary>Voir le rapport (${esc(r.kind)})</summary>${r.par?`<div class="mu">Par : ${esc(r.par)}</div>`:''}${r.objet?`<p><b>Objet / problèmes signalés</b><pre>${esc(r.objet)}</pre></p>`:''}${r.points.length?`<p><b>Actions correctives</b><pre>${esc(r.points.join('\n'))}</pre></p>`:''}${r.diag?`<p><b>Observations / diagnostic</b><pre>${esc(r.diag)}</pre></p>`:''}${r.pieces?`<p><b>Pièces changées</b><pre>${esc(r.pieces)}</pre></p>`:''}${r.actions?`<p><b>Actions à mener</b><pre>${esc(r.actions)}</pre></p>`:''}</details>`:''}</div>`}).join('');
 const J=(D.journal||[]).map(j=>`<div class="jr"><b>${esc(j.action)}</b><span class="mu">${esc(String(j.date).replace(/^(\d{4})-(\d\d)-(\d\d)/,'$3/$2/$1'))}</span><pre>${esc(j.detail)}</pre></div>`).join('');
 $('#v').innerHTML=`<h2>Journal de mes modifications<span class="ro">🔒 lecture seule</span></h2><p class="mu" style="margin-top:-4px">Toutes les modifications faites sur votre compte et vos machines sont enregistrées ici automatiquement. Cet historique ne peut pas être modifié.</p>${J||'<div class="card mu">Aucune modification pour le moment.</div>'}
 <h2>Mes demandes au support</h2>${T||'<div class="card mu">Aucune demande pour le moment.</div>'}<h2>Interventions et maintenances</h2>${I||'<div class="card mu">Aucune intervention enregistrée.</div>'}`}
login();
try{if(sessionStorage.getItem('bw_choice')==='1'&&!sessionStorage.getItem('bw_sav'))choose()}catch(e){}
</script></body></html>
