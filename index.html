<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow"><title>Espace client Bowman</title>
<style>
:root{--bg:#f1f4f2;--card:#fff;--tx:#1c2420;--mu:#5f6a64;--bd:#d9e0db;--ac:#1a9243;--onac:#fff;--ac2:#e5f4ea;--ok:#1a9243;--wa:#b86e00;--ko:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1411;--card:#18201b;--tx:#e8efea;--mu:#9aa8a0;--bd:#2a362e;--ac:#3fc468;--onac:#08210f;--ac2:#16281d;--ok:#3fc468;--wa:#f0a93b;--ko:#ef7466}}
*{box-sizing:border-box}html,body{margin:0}body{background-image:linear-gradient(180deg,var(--bg),var(--card) 140%);min-height:100vh;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,60,35,.05)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{min-height:110px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--ac);color:var(--onac);font-weight:600}
button.sec{background:var(--ac2);color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin:8px 0 16px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.b-ok{color:var(--ok)}.b-wa{color:var(--wa)}.b-ko{color:var(--ko)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}
.grid>.card{display:flex;flex-direction:column;margin-bottom:0}.grid>.card>.row:last-child{margin-top:auto}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.rec{background:var(--ac2);border-radius:8px;padding:10px 12px;font-size:14px}.rec b{display:inline-block;min-width:140px}
.err{color:var(--ko);margin-top:10px}.okmsg{background:var(--ac2);border-left:4px solid var(--ok);padding:12px;border-radius:8px;margin-bottom:12px}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer}
pre{white-space:pre-wrap;font:inherit;margin:6px 0}
.seg{display:flex;gap:8px}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.hid{display:none}.logo{display:block;width:min(300px,80%);height:auto;margin:0 auto 18px}.lg-s{height:38px;width:auto;display:block}.login{max-width:400px;margin:0 auto;padding-top:9vh}.login .card{padding:28px 26px;box-shadow:0 10px 40px rgba(20,60,35,.10);border-radius:16px;border-top:4px solid var(--ac)}.login h1{text-align:center;font-size:18px}.login .sub{text-align:center;margin:6px 0 4px}.hdr{background:var(--card);border-bottom:3px solid var(--ac);box-shadow:0 2px 12px rgba(20,60,35,.06)}.hdr .in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hdr b{font-size:15px}.hdr .mu{font-size:12px}
</style></head><body><div id="app"></div>

let S=null,D=null,tab='machines',type='intervention',pre='',flash='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=s=>{const m=String(s||'').match(/^(\d{4})-(\d\d)-(\d\d)/);return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'—')};
function api(o){return new Promise((res,rej)=>{
 if(!(window.google&&google.script&&google.script.run))return rej(new Error('Ouvrez cette page depuis le lien fourni par Bowman France.'));
 google.script.run.withSuccessHandler(t=>{try{res(JSON.parse(t))}catch(e){rej(new Error('Réponse invalide'))}}).withFailureHandler(e=>rej(new Error((e&&e.message)||e))).apiCall(JSON.stringify(o))})}
function erreur(r){return r.error==='auth'?'Nom ou mot de passe incorrect.':r.error==='verrou'?'Trop de tentatives. Réessayez dans 15 minutes.':r.error==='occupe'?'Service occupé, réessayez.':(r.error||'Erreur')}

let eq=false;
function login(){
 $('#app').innerHTML=`<div class="wrap"><div class="login"><div class="card"><img class="logo" src="${LOGO}" alt="Bowman France"><h1>${eq?'Accès équipe SAV':'Espace client Bowman France'}</h1><p class="mu sub">${eq?'Réservé à l’équipe Bowman France.':'Connectez-vous pour consulter vos machines, votre historique et contacter le support.'}</p>
 ${eq?'':'<label>Nom de votre société</label><input id="ln" autocomplete="username">'}<label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password">
 <p class="err" id="le"></p><button id="lb" style="width:100%">Se connecter</button>
 <p style="text-align:center;margin:14px 0 0"><a href="#" id="sw" style="color:var(--mu);font-size:13px">${eq?'← Accès client':'Accès équipe SAV'}</a></p></div></div></div>`;
 $('#sw').onclick=e=>{e.preventDefault();eq=!eq;login()};
 const go=async()=>{const b=$('#lb');b.disabled=true;$('#le').textContent='';
  try{
   if(eq){
    if(!(window.google&&google.script&&google.script.run))throw new Error('Ouvrez cette page depuis le lien fourni par Bowman France.');
    google.script.run.withSuccessHandler(h=>{if(!h){$('#le').textContent='Mot de passe incorrect.';b.disabled=false;return}
      document.open();document.write(h);document.close()})
     .withFailureHandler(e=>{$('#le').textContent=(e&&e.message)||'Erreur';b.disabled=false}).ouvrirSav($('#lp').value);
    return}
   const r=await api({action:'client_login',client:$('#ln').value,mdp:$('#lp').value});
   if(!r.ok){$('#le').textContent=erreur(r);b.disabled=false;return}
   S={client:$('#ln').value,mdp:$('#lp').value};D=r;tab='machines';draw()}
  catch(e){$('#le').textContent=e.message;b.disabled=false}};
 $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()}}

function addM(iso,m){const x=String(iso||'').match(/^(\d{4})-(\d\d)-(\d\d)/);if(!x||!(+m>0))return null;const d=new Date(+x[1],+x[2]-1+ +m,+x[3]);return d}
function etat(m){const nx=addM(m.d,m.p||D.per);if(!nx)return['Date inconnue','','—'];
 const j=Math.round((nx-new Date())/864e5),t=nx.toLocaleDateString('fr-FR');
 return j<0?['En retard','b-ko',t]:j<=D.seuil?['À prévoir','b-wa',t]:['À jour','b-ok',t]}
const nomM=m=>[m.g,m.mo].filter(Boolean).join(' ')||'Machine';

function draw(){
 const c=D.client;
 $('#app').innerHTML=`<div class="hdr"><div class="in"><div style="display:flex;align-items:center;gap:14px;min-width:0"><img class="lg-s" src="${LOGO}" alt="Bowman France"><div style="min-width:0"><b>${esc(c.n)}</b><div class="mu">Espace client</div></div></div><button class="sec" id="out">Déconnexion</button></div></div><div class="wrap">
 ${flash?`<div class="okmsg">${flash}</div>`:''}
 <div class="tabs">${[['machines','Mes machines'],['demande','Nouvelle demande'],['histo','Historique']].map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="v"></div></div>`;
 flash='';$('#out').onclick=()=>{S=D=null;login()};
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;pre='';draw()});
 ({machines:vMachines,demande:vDemande,histo:vHisto})[tab]()}

function vMachines(){
 $('#v').innerHTML=D.machines.length?`<div class="grid">${D.machines.map((m,i)=>{const e=etat(m);return`<div class="card"><div class="row"><b>${esc(nomM(m))}</b><span class="badge ${e[1]}">${e[0]}</span></div>
 <div class="mu">N° de série : ${esc(m.sn||'—')}${m.rf?' · Réf. '+esc(m.rf):''}</div>
 <div style="margin:8px 0">Dernière maintenance : ${fd(m.d)}<br>Prochaine : ${e[2]}${m.pl?'<br>Visite planifiée : '+fd(m.pl):''}${m.ga?'<br>Fin de garantie : '+fd(m.ga):''}</div>
 <div class="row"><button data-i="${i}" data-ty="intervention">Demander une intervention</button><button class="sec" data-i="${i}" data-ty="ticket">Ticket</button></div></div>`}).join('')}</div>`:'<div class="card mu">Aucune machine enregistrée.</div>';
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{type=b.dataset.ty;pre=b.dataset.i;tab='demande';draw()})}

function vDemande(){
 const c=D.client,adr=[c.ad,[c.cp,c.v].filter(Boolean).join(' ')].filter(Boolean).join(', ');
 $('#v').innerHTML=`<div class="card"><div class="seg"><button data-k="intervention" class="${type==='intervention'?'on':''}">Demande d’intervention</button><button data-k="ticket" class="${type==='ticket'?'on':''}">Ticket support</button></div>
 <label>Machine concernée</label><select id="fm">${type==='ticket'?'<option value="">— Aucune machine en particulier —</option>':''}${D.machines.map((m,i)=>`<option value="${i}" ${String(i)===pre?'selected':''}>${esc(nomM(m))} — ${esc(m.sn||'sans n°')}</option>`).join('')}</select>
 <div class="rec" style="margin-top:12px" id="rc"></div>
 <label>Urgence</label><select id="fu"><option>Normale</option><option>Urgente</option><option>Machine à l’arrêt</option></select>
 <label>Objet</label><input id="fo" maxlength="150" placeholder="${type==='intervention'?'Ex. : panne, maintenance, calibrage…':'Ex. : question, message d’erreur…'}">
 <label>Description</label><textarea id="fd" maxlength="4000" placeholder="Décrivez le problème ou votre besoin"></textarea>
 <div class="grid"><div><label>Contact sur site</label><input id="fc" value="${esc(c.ct)}"></div><div><label>Téléphone</label><input id="ft" value="${esc(c.t)}"></div></div>
 <label>E-mail de réponse</label><input id="fe" type="email" value="${esc(String(c.e||'').split(/[;, ]/)[0])}">
 <p class="err" id="fr"></p><button id="send" style="width:100%;margin-top:6px">Envoyer à ${esc(D.support)}</button></div>`;
 const rec=()=>{const i=$('#fm').value,m=i===''?null:D.machines[+i];
  $('#rc').innerHTML=`<b>Client</b> ${esc(c.n)}<br><b>Machine</b> ${m?esc(nomM(m)):'—'}<br><b>N° de série</b> ${m?esc(m.sn||'—'):'—'}<br><b>Adresse du site</b> ${esc(adr||'—')}<br><b>Envoyé à</b> ${esc(D.support)}`};
 rec();$('#fm').onchange=()=>{pre=$('#fm').value;rec()};
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{type=b.dataset.k;draw()});
 $('#send').onclick=async()=>{const b=$('#send');b.disabled=true;$('#fr').textContent='';
  try{const r=await api({action:'client_ticket',client:S.client,mdp:S.mdp,type,mi:$('#fm').value,urgence:$('#fu').value,objet:$('#fo').value,message:$('#fd').value,contact:$('#fc').value,tel:$('#ft').value,email:$('#fe').value});
   if(!r.ok){$('#fr').textContent=erreur(r);b.disabled=false;return}
   D.tickets=r.tickets;flash='Demande envoyée au support. Référence : <b>'+esc(r.ref)+'</b>. Vous recevez une copie par e-mail.';tab='histo';pre='';draw()}
  catch(e){$('#fr').textContent=e.message;b.disabled=false}}}

function vHisto(){
 const T=D.tickets.map(t=>`<div class="card"><div class="row"><b>${esc(t.objet)}</b><span class="badge">${esc(t.statut)}</span></div>
 <div class="mu">${esc(t.ref)} · ${esc(t.type)} · ${esc(String(t.date).slice(0,10).split('-').reverse().join('/'))}${t.machine?' · '+esc(t.machine)+(t.sn?' ('+esc(t.sn)+')':''):''}${t.urgence!=='Normale'?' · '+esc(t.urgence):''}</div><pre>${esc(t.message)}</pre></div>`).join('');
 const I=D.interventions.map(it=>{const r=it.rapport;return`<div class="card"><div class="row"><b>${fd(it.d)} · ${esc(it.ty||'Intervention')}</b><span class="mu">${esc(it.te||'')}</span></div>
 <div class="mu">${esc(it.m||'')}${it.sn?' · N° '+esc(it.sn):''}</div>${it.n?`<pre>${esc(it.n)}</pre>`:''}
 ${r?`<details><summary>Voir le rapport (${esc(r.kind)})</summary>${r.par?`<div class="mu">Par : ${esc(r.par)}</div>`:''}${r.objet?`<p><b>Objet / problèmes signalés</b><pre>${esc(r.objet)}</pre></p>`:''}${r.points.length?`<p><b>Actions correctives</b><pre>${esc(r.points.join('\n'))}</pre></p>`:''}${r.diag?`<p><b>Observations / diagnostic</b><pre>${esc(r.diag)}</pre></p>`:''}${r.pieces?`<p><b>Pièces changées</b><pre>${esc(r.pieces)}</pre></p>`:''}${r.actions?`<p><b>Actions à mener</b><pre>${esc(r.actions)}</pre></p>`:''}</details>`:''}</div>`}).join('');
 $('#v').innerHTML=`<h2>Mes demandes au support</h2>${T||'<div class="card mu">Aucune demande pour le moment.</div>'}<h2>Interventions et maintenances</h2>${I||'<div class="card mu">Aucune intervention enregistrée.</div>'}`}
login();
</script></body></html>
